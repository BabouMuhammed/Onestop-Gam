name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onestop
          POSTGRES_PASSWORD: onestop
          POSTGRES_DB: onestop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onestop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://onestop:onestop@localhost:5432/onestop_test
      TEST_DATABASE_URL: postgresql://onestop:onestop@localhost:5432/onestop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: pip install openpyxl && npm run test:tools
      - run: npm audit --audit-level=high
