# Render Blueprint for a DEMO of Onestopgam: one free web service that runs the API and
# serves the web app, and one free PostgreSQL database.
#
# Free-plan limits (check Render's pricing page before relying on them): the service
# sleeps when idle and takes about a minute to wake, and the free database expires
# roughly 30 days after it is created. Do not keep real business records here.
databases:
  - name: onestop-demo-db
    plan: free
    databaseName: onestop
    user: onestop

services:
  - type: web
    name: onestop-demo
    runtime: node
    plan: free
    branch: main
    # Build tools are dev dependencies, so they are installed even though NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    # Apply reviewed migrations, make sure the divisions and first administrator exist, then start.
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onestop-demo-db
          property: connectionString
      # The API serves the built web app, so the browser talks to a single origin.
      - key: WEB_DIST
        value: ../web/dist
      - key: TRUST_PROXY
        value: "1"
      # Encrypts two-step sign-in secrets. Render generates a random value once; do not change it
      # later, or CEO and Finance have to set up two-step sign-in again.
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      # First administrator. Entered in the Render dashboard, never committed.
      # The password (at least 10 characters) must be changed at first sign-in.
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
